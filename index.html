<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>С днём рождения!</title>
    <style>
      :root {
        --cw: min(260px, 44vw);
        --back: #173a4a;
        --back-edge: #e2a93a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #fff;
        background: radial-gradient(
          ellipse at 50% 38%,
          #2b5a78 0%,
          #152642 55%,
          #090e1b 100%
        );
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 56px 12px 110px;
        pointer-events: none;
      }

      .greeting {
        margin: 0;
        text-align: center;
        font-size: clamp(28px, 6vw, 56px);
        font-weight: 800;
        line-height: 1.05;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
      }

      .sub {
        margin: 10px 0 0;
        text-align: center;
        font-size: clamp(14px, 2.4vw, 18px);
        opacity: 0.88;
      }

      .lock {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(360px, 90vw);
        pointer-events: auto;
      }

      .lock__row {
        display: flex;
        gap: 8px;
        width: 100%;
      }

      .lock__input {
        flex: 1;
        min-width: 0;
        padding: 14px 16px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font:
          600 18px system-ui,
          sans-serif;
        outline: none;
      }

      .lock__input:focus {
        border-color: #e2a93a;
      }

      .lock__button {
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        background: #e2a93a;
        color: #1b1408;
        font:
          800 16px system-ui,
          sans-serif;
        cursor: pointer;
      }

      .lock__button:disabled {
        opacity: 0.6;
      }

      .lock__error {
        min-height: 20px;
        margin: 0;
        font-size: 14px;
        color: #ffd0c4;
      }

      .lock.is-wrong .lock__row {
        animation: wrong 0.4s;
      }

      body:not(.locked) .lock {
        display: none;
      }

      body.locked .cards,
      body.locked .die,
      body.locked .meeple {
        display: none;
      }

      .cards {
        display: flex;
        gap: clamp(12px, 3vw, 40px);
        justify-content: center;
      }

      .slot {
        font-size: calc(var(--cw) / 16.25);
      }

      .slot_a {
        rotate: -2.5deg;
      }

      .slot_b {
        rotate: 2.5deg;
      }

      .card {
        width: var(--cw);
        aspect-ratio: 5 / 7;
        perspective: 900px;
        pointer-events: auto;
        --rx: 0deg;
        --ry: 0deg;
      }

      .tilt,
      .flip {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }

      .tilt {
        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transition: transform 0.35s ease-out;
      }

      .card.is-tilting .tilt {
        transition-duration: 0.06s;
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 0.9em;
        overflow: hidden;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
      }

      .back {
        transform: rotateY(180deg);
        display: grid;
        place-items: center;
        background: var(--back);
        border: 0.16em solid var(--back-edge);
        box-shadow:
          inset 0 0 0 0.4em var(--back),
          inset 0 0 0 0.5em var(--back-edge),
          0 14px 30px rgba(0, 0, 0, 0.5);
      }

      .emblem {
        width: 55%;
      }

      .front {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.45em;
        padding: 0.8em;
        border: 0.22em solid #151922;
        background: linear-gradient(#3b4356, #232936);
        color: #f3ead2;
        text-align: center;
      }

      .games {
        --accent: #e2a93a;
        --art: radial-gradient(circle at 50% 40%, #fff3c9, #e2a93a);
      }

      .tea {
        --accent: #d9776f;
        --art: radial-gradient(circle at 50% 40%, #fff6ea, #e3b3a6);
      }

      .cost {
        position: absolute;
        z-index: 1;
        top: 0.3em;
        left: 0.3em;
        display: grid;
        place-items: center;
        width: 2.1em;
        height: 2.1em;
        border: 0.14em solid #f3ead2;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #c6ecff,
          #2f7fd0 60%,
          #18457a
        );
        color: #fff;
        font-size: 1.05em;
        font-weight: 800;
        text-shadow: 0 1px 2px #000;
      }

      .title {
        width: 82%;
        margin-left: 14%;
        padding: 0.32em 0.6em;
        border-radius: 0.5em;
        background: var(--accent);
        color: #1b1408;
        font-size: 0.95em;
        font-weight: 800;
        line-height: 1.05;
        box-shadow: 0 0.16em 0 rgba(0, 0, 0, 0.4);
      }

      .art {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        display: grid;
        place-items: center;
        padding: 0.4em;
        border: 0.18em solid var(--accent);
        border-radius: 0.6em;
        background: var(--art);
      }

      .art svg {
        height: 100%;
        max-width: 100%;
      }

      .type {
        position: relative;
        margin-top: -1.3em;
        padding: 0.2em 0.9em;
        border: 0.14em solid var(--accent);
        border-radius: 999px;
        background: #151922;
        font-size: 0.6em;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .text {
        width: 100%;
        padding: 0.4em 0.5em;
        border-radius: 0.5em;
        background: rgba(0, 0, 0, 0.3);
        font-size: 0.78em;
        line-height: 1.3;
      }

      .hint {
        font-size: 0.56em;
        letter-spacing: 0.12em;
        opacity: 0.75;
      }

      .code {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4em;
        width: 100%;
        padding: 0.4em;
        border: 1px dashed currentColor;
        border-radius: 0.4em;
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
        font:
          700 1.03em/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        cursor: pointer;
      }

      .code span {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .code svg {
        flex: none;
        width: 0.9em;
        height: 0.9em;
        opacity: 0.8;
      }

      .contacts {
        font-size: 0.68em;
        line-height: 1.35;
      }

      .contacts a {
        color: inherit;
        text-decoration: none;
      }

      .decor {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .deck {
        position: absolute;
        top: -34px;
        right: -22px;
        width: 78px;
        height: 109px;
        rotate: 18deg;
      }

      .deck i {
        position: absolute;
        inset: 0;
        border: 3px solid var(--back-edge);
        border-radius: 9px;
        background: var(--back);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45);
      }

      .deck i:nth-child(2) {
        translate: -3px -3px;
      }

      .deck i:nth-child(3) {
        translate: -6px -6px;
      }

      .die {
        position: absolute;
        bottom: 28px;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        gap: 2px;
        width: 44px;
        height: 44px;
        padding: 7px;
        border-radius: 9px;
        background: #fff;
        box-shadow:
          inset 0 -4px 0 rgba(0, 0, 0, 0.12),
          0 6px 10px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        pointer-events: auto;
        transform: rotate(var(--r));
      }

      .die i {
        border-radius: 50%;
      }

      .die i.on {
        background: #1b1b1b;
      }

      .meeple {
        position: absolute;
        bottom: 26px;
        width: 36px;
        height: 36px;
        fill: var(--c);
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35));
      }

      .cup {
        position: absolute;
        right: 12px;
        bottom: 16px;
        width: clamp(64px, 11vw, 110px);
        color: rgba(255, 255, 255, 0.75);
      }

      .steam path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: steam 3.2s ease-in-out infinite;
      }

      .steam path:nth-child(2) {
        animation-delay: 0.9s;
      }

      .steam path:nth-child(3) {
        animation-delay: 1.7s;
      }

      .toast {
        position: fixed;
        z-index: 11;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 20px);
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-size: 14px;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #confetti {
        position: fixed;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      body.play .greeting {
        animation: rise 0.7s both;
      }

      body.play .sub {
        animation: rise 0.7s 2.1s both;
      }

      body.play .slot {
        animation: deal 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      body.play .slot_a {
        animation-delay: 0.3s;
      }

      body.play .slot_b {
        animation-delay: 0.8s;
      }

      body.play .flip {
        animation: flip 0.6s ease-in-out backwards;
      }

      body.play .slot_a .flip {
        animation-delay: 0.95s;
      }

      body.play .slot_b .flip {
        animation-delay: 1.45s;
      }

      body.play .die {
        animation: rollIn 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) both;
        animation-delay: var(--d);
      }

      body.play .die.settled {
        animation: none;
      }

      body.play .die.settled.rolling {
        animation: spin 0.5s ease-out;
      }

      body.play .meeple {
        animation:
          pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both,
          hop 2.6s ease-in-out infinite;
        animation-delay: calc(1.9s + var(--d)), calc(3.2s + var(--d) * 4);
      }

      @keyframes wrong {
        0%,
        100% {
          transform: none;
        }

        25% {
          transform: translateX(-8px);
        }

        75% {
          transform: translateX(8px);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes deal {
        from {
          opacity: 0;
          transform: translate(45vw, -60vh) rotate(60deg) scale(0.6);
        }

        15% {
          opacity: 1;
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes flip {
        from {
          transform: rotateY(180deg);
        }

        to {
          transform: rotateY(0deg);
        }
      }

      @keyframes rollIn {
        from {
          opacity: 0;
          transform: translate(-60vw, -30vh) rotate(-900deg);
        }

        20% {
          opacity: 1;
        }

        to {
          opacity: 1;
          transform: rotate(var(--r));
        }
      }

      @keyframes spin {
        from {
          transform: rotate(calc(var(--r) - 720deg)) scale(1.25);
        }

        to {
          transform: rotate(var(--r)) scale(1);
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes hop {
        0%,
        20%,
        100% {
          transform: none;
        }

        10% {
          transform: translateY(-10px);
        }
      }

      @keyframes steam {
        0% {
          stroke-dashoffset: 100;
          opacity: 0;
        }

        25% {
          opacity: 1;
        }

        100% {
          stroke-dashoffset: -100;
          opacity: 0;
        }
      }

      @media (min-width: 761px) {
        .deck {
          top: 60px;
          right: 40px;
          width: 110px;
          height: 154px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <div class="toast" role="status"></div>

    <script>
      const PAYLOAD = "f/lnmsHXPMKRhYTZxjtbRoyzQ+riJ1lXTxpdmjWm0F942BEsoiPgIHHDBe4sT4GGo7mitIicYMVXCDoZ4gvvLawUoxB2EKJbm/acB2Sq4SvuffmPnWH9di1Nu2wySCjyTXzPbNB+u6IerMKysg==";
      const PBKDF2_ITERATIONS = 600000;
      const SALT_BYTES = 16;
      const IV_BYTES = 12;
      const UNLOCKED_SUBTITLE = "Награда за год: обе карты в твою колоду";
      const WRONG_PASSWORD = "Не подошло. Попробуй ещё раз";
      const OPENING = "Открываю…";
      const OPEN = "Открыть";
      const CONFETTI_COLORS = [
        "#e2a93a",
        "#d9776f",
        "#c6ecff",
        "#ffffff",
        "#2f7fd0",
      ];
      const CONFETTI_DELAY_MS = 2100;
      const CONFETTI_COUNT = 150;
      const CONFETTI_LIFE = 240;
      const CONFETTI_GRAVITY = 0.45;
      const PIPS = {
        1: [4],
        2: [0, 8],
        3: [0, 4, 8],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8],
      };
      const DIE_CELLS = 9;
      const DIE_FACES = 6;
      const TILT_Y_DEG = 24;
      const TILT_X_DEG = 18;
      const TOAST_MS = 1600;

      const body = document.body;
      const sub = document.querySelector(".sub");
      const lock = document.querySelector(".lock");
      const passwordInput = document.querySelector(".lock__input");
      const lockButton = document.querySelector(".lock__button");
      const lockError = document.querySelector(".lock__error");
      const toast = document.querySelector(".toast");
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const dice = document.querySelectorAll(".die");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      let particles = [];
      let frame = 0;
      let toastTimer = 0;

      function normalizePassword(value) {
        return value
          .normalize("NFC")
          .trim()
          .toLowerCase()
          .replace(/ё/g, "е")
          .replace(/\s+/g, " ");
      }

      function decodeBase64(value) {
        return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      }

      async function decryptPayload(password) {
        const bytes = decodeBase64(PAYLOAD);
        const salt = bytes.slice(0, SALT_BYTES);
        const iv = bytes.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
        const data = bytes.slice(SALT_BYTES + IV_BYTES);
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: PBKDF2_ITERATIONS,
            hash: "SHA-256",
          },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        const plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          data,
        );

        return JSON.parse(new TextDecoder().decode(plain));
      }

      function fillCodes(codes) {
        for (const [field, code] of Object.entries(codes)) {
          const button = document.querySelector(`.code[data-field="${field}"]`);

          if (button) {
            button.dataset.code = code;
            button.querySelector("span").textContent = code;
          }
        }
      }

      function fitCanvas() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
      }

      function drawConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter(
          (p) => p.y < canvas.height + 40 && p.life < CONFETTI_LIFE,
        );

        for (const p of particles) {
          p.vy += CONFETTI_GRAVITY * window.devicePixelRatio;
          p.vx *= 0.99;
          p.x += p.vx;
          p.y += p.vy;
          p.angle += p.spin;
          p.life += 1;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.globalAlpha = Math.max(0, 1 - p.life / CONFETTI_LIFE);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          ctx.restore();
        }

        if (particles.length > 0) {
          frame = requestAnimationFrame(drawConfetti);
        }
      }

      function burst() {
        const ratio = window.devicePixelRatio;

        fitCanvas();
        particles = Array.from({ length: CONFETTI_COUNT }, () => ({
          x: canvas.width / 2,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 24 * ratio,
          vy: (-Math.random() * 18 - 4) * ratio,
          size: (Math.random() * 8 + 5) * ratio,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.4,
          color:
            CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          life: 0,
        }));
        cancelAnimationFrame(frame);
        drawConfetti();
      }

      function reveal() {
        sub.textContent = UNLOCKED_SUBTITLE;
        passwordInput.blur();
        body.classList.remove("locked");
        void body.offsetWidth;
        body.classList.add("play");

        if (!reducedMotion) {
          setTimeout(burst, CONFETTI_DELAY_MS);
        }
      }

      function rejectPassword() {
        lockError.textContent = WRONG_PASSWORD;
        lock.classList.remove("is-wrong");
        void lock.offsetWidth;
        lock.classList.add("is-wrong");
        passwordInput.select();
      }

      function setDie(die, value) {
        die.querySelectorAll("i").forEach((pip, index) => {
          pip.classList.toggle("on", PIPS[value].includes(index));
        });
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), TOAST_MS);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);

          return true;
        } catch (error) {
          const area = document.createElement("textarea");

          area.value = text;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();

          const copied = document.execCommand("copy");

          area.remove();

          return copied;
        }
      }

      lock.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (PAYLOAD === "") {
          reveal();

          return;
        }

        lockButton.disabled = true;
        lockButton.textContent = OPENING;
        lockError.textContent = "";

        try {
          fillCodes(
            await decryptPayload(normalizePassword(passwordInput.value)),
          );
          reveal();
        } catch (error) {
          rejectPassword();
        } finally {
          lockButton.disabled = false;
          lockButton.textContent = OPEN;
        }
      });

      dice.forEach((die) => {
        for (let i = 0; i < DIE_CELLS; i += 1) {
          die.appendChild(document.createElement("i"));
        }

        setDie(die, Number(die.dataset.n));

        die.addEventListener("animationend", (event) => {
          if (event.animationName === "rollIn") {
            die.classList.add("settled");
          }

          if (event.animationName === "spin") {
            die.classList.remove("rolling");
          }
        });

        die.addEventListener("click", () => {
          if (!die.classList.contains("settled")) {
            return;
          }

          setDie(die, 1 + Math.floor(Math.random() * DIE_FACES));
          die.classList.remove("rolling");
          void die.offsetWidth;
          die.classList.add("rolling");
        });
      });

      document.querySelectorAll(".card").forEach((card) => {
        const reset = () => {
          card.classList.remove("is-tilting");
          card.style.setProperty("--rx", "0deg");
          card.style.setProperty("--ry", "0deg");
        };

        card.addEventListener("pointermove", (event) => {
          const rect = card.getBoundingClientRect();
          const px = (event.clientX - rect.left) / rect.width;
          const py = (event.clientY - rect.top) / rect.height;

          card.style.setProperty("--ry", `${(px - 0.5) * TILT_Y_DEG}deg`);
          card.style.setProperty("--rx", `${(0.5 - py) * TILT_X_DEG}deg`);
          card.classList.add("is-tilting");
        });
        card.addEventListener("pointerleave", reset);
        card.addEventListener("pointercancel", reset);
      });

      document.querySelectorAll(".code").forEach((button) => {
        button.addEventListener("click", async () => {
          const copied = await copyText(button.dataset.code);

          showToast(copied ? "Код скопирован" : "Не получилось скопировать");
        });
      });

      window.addEventListener("resize", fitCanvas);
    </script>
  </body>
</html>
